<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Trainer: Verb Patterns</title>
<style>
:root{--bg:#fff5f9;--card:#fff;--tx:#2d1b33;--mu:#85708d;--ac:#e0457b;--ac2:#ffe0ec;--ok:#1f9d55;--okb:#e3f6ea;--no:#e03131;--nob:#ffe9e9;--bd:#f7d3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1020;--card:#2a1830;--tx:#fbeaf3;--mu:#c3a3b8;--ac:#ff6fa5;--ac2:#4a2140;--ok:#4ade80;--okb:#173625;--no:#ff6b6b;--nob:#40201f;--bd:#553055;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1020;--card:#2a1830;--tx:#fbeaf3;--mu:#c3a3b8;--ac:#ff6fa5;--ac2:#4a2140;--ok:#4ade80;--okb:#173625;--no:#ff6b6b;--nob:#40201f;--bd:#553055;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top right,var(--ac2),var(--bg) 55%) fixed,var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 2px;background:linear-gradient(90deg,#e0457b,#a64df0);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mu);margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button{border-radius:999px!important}.tabs button.on{background:linear-gradient(90deg,#e0457b,#f06aa8);border-color:transparent;color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(224,69,123,.12)}
.card h3{margin:0 0 6px;font-size:17px}
.f{display:inline-block;background:var(--ac2);color:var(--ac);font-weight:700;border-radius:8px;padding:2px 9px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.vs{color:var(--mu);margin:8px 0}.vs b{color:var(--tx)}
.ex{border-left:3px solid var(--ac);padding-left:10px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--ac2);border-radius:20px;padding:4px 10px;font-size:14px}.chip i{color:var(--mu);font-style:normal}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar div{height:100%;background:linear-gradient(90deg,#f06aa8,#a64df0);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin-bottom:6px}
.q{font-size:20px;margin:8px 0 14px}.q u{display:inline-block;min-width:70px;border-bottom:2px solid var(--ac);text-align:center;text-decoration:none;color:var(--ac);font-weight:700}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o.ok{border-color:var(--ok);background:var(--okb)}.o.no{border-color:var(--no);background:var(--nob)}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;display:none}.fb.ok{display:block;background:var(--okb)}.fb.no{display:block;background:var(--nob)}
.btn{margin-top:12px;padding:12px 22px;border:0;border-radius:999px;background:linear-gradient(90deg,#e0457b,#f06aa8);box-shadow:0 4px 12px rgba(224,69,123,.3);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--ac)}
.big{font-size:44px;font-weight:800;color:var(--ac);text-align:center}.c{text-align:center}
</style></head><body><div class="w">
<h1>🌸 Grammar Trainer</h1><p class="sub">Verb patterns · 46 вправ · кожен раунд — 15 випадкових питань 💖</p>
<div class="tabs"><button id="t0" class="on">📘 Правила</button><button id="t1">✏️ Вправи</button></div>
<div id="rules"></div><div id="quiz" hidden></div>
</div>
<script>
const P=[
["1","verb + to + infinitive","V1 + to + V","aim, arrange, attempt, can’t afford, decide, expect, hope, intend, manage, offer, plan, refuse, remember, seem, tend, try, want, agree","We decided to go to the festival."],
["2","verb + object + to infinitive","V1 + object + to + V","advise, allow, encourage, force, remind, teach, urge, warn (not)","The teacher warned us not to touch the wires."],
["3","verb + -ing","V1 + V-ing","avoid, can’t help, can’t stand, don’t mind, enjoy, fancy, finish, imagine, keep, miss, stop, waste time","I enjoy photographing landscapes."],
["4","modal verb + infinitive without to","modal + V","can, could, might, should, would","You should avoid unnecessary stress."],
["5","verb + object + infinitive without to","V1 + object + V","make, let","The coach made the athlete repeat the sequence several times."]];
const W=[["unnecessary","непотрібний"],["first step towards","перший крок до"],["athlete","спортсмен"],["allow(s)","дозволяти"],["sequence","послідовність"],["several times","кілька разів"],["force","змушувати"],["urge","закликати"],["cheer","вітати, підбадьорювати"],["festival","фестиваль"],["warn(ed)","попереджати"],["wires","дроти"],["landscapes","краєвиди"],["manage(d)","вдаватися, зуміти"],["seem(s)","здаватися"]];
const Q=[
["The coach urged the athletes ___ harder.",["to train","train","training","trained"],0,2,"urge + object + to + V."],
["Our teacher warned us ___ the wires.",["not to touch","don’t touch","not touching","to not touching"],0,2,"warn + object + (not) to + V."],
["We decided ___ the music festival in July.",["to visit","visiting","visit","visited"],0,1,"decide + to + V."],
["The athlete managed ___ the record.",["to break","breaking","break","broke"],0,1,"manage + to + V (вдалося зробити)."],
["It seems ___ a great idea.",["to be","being","be","to being"],0,1,"seem + to + V."],
["The loud music made the crowd ___ with joy.",["cheer","to cheer","cheering","cheered up to"],0,5,"make + object + V без to."],
["The app allows users ___ photos for free.",["to share","share","sharing","shared"],0,2,"allow + object + to + V."],
["I really enjoy ___ landscapes in the mountains.",["painting","to paint","paint","to painting"],0,3,"enjoy + V-ing."],
["Try to avoid ___ unnecessary words in your essay.",["using","to use","use","used"],0,3,"avoid + V-ing."],
["Reading every day is the first step towards ___ better at English.",["being","to be","be","been to"],0,3,"Після прийменника (towards) — V-ing."],
["Nobody can force you ___ something you don’t want.",["to do","do","doing","done"],0,2,"force + object + to + V."],
["The coach made the athlete ___ the sequence several times.",["repeat","to repeat","repeating","repeated to"],0,5,"make + object + V без to."],
["The fans couldn’t help ___ when she scored.",["cheering","to cheer","cheer","to cheering"],0,3,"can’t help + V-ing."],
["We hope ___ the festival again next year.",["to attend","attending","attend","attended"],0,1,"hope + to + V."],
["Don’t let the kids ___ with the wires!",["play","to play","playing","played"],0,5,"let + object + V без to."],
["We finally managed ___ the broken wires.",["to fix","fixing","fix","fixed"],0,1,"manage + to + V."],
["She can ___ unnecessary things very quickly.",["recognise","to recognise","recognising","recognised to"],0,4,"can + V без to."],
["My parents don’t allow me ___ up late.",["to stay","stay","staying","stayed"],0,2,"allow + object + to + V."],
["The photographer stopped ___ the landscapes and had lunch.",["photographing","to photograph him","photograph","photographed to"],0,3,"stop + V-ing (припинити дію)."],
["The doctor urged the athlete ___ more water.",["to drink","drink","drinking","drank"],0,2,"urge + object + to + V."],
["It seems ___ unnecessary to buy a second ticket.",["to be","being","be","to being"],0,1,"seem + to + V."],
["The festival organisers refused ___ the show.",["to cancel","cancelling","cancel","cancelled"],0,1,"refuse + to + V."],
["The teacher warned him ___ late again.",["not to be","not be","don’t be","not being"],0,2,"warn + object + not to + V."],
["You should ___ the first step towards your goal today.",["take","to take","taking","took to"],0,4,"should + V без to."],
["My brother can’t stand ___ in long queues at the festival.",["waiting","to wait up","wait","waited"],0,3,"can’t stand + V-ing."],
["The coach reminded the team ___ their shoes.",["to bring","bring","bringing","brought"],0,2,"remind + object + to + V."],
["Our teacher encouraged us ___ photos of landscapes.",["to take","take","taking","took"],0,2,"encourage + object + to + V."],
["He agreed ___ me with the wires.",["to help","helping","help","helped to"],0,1,"agree + to + V."],
["They can’t afford ___ tickets to the festival.",["to buy","buying","buy","bought"],0,1,"can’t afford + to + V."],
["Let me ___ you the first step towards a healthy life.",["show","to show","showing","showed to"],0,5,"let + object + V без to."],
["The athlete kept ___ even when he was tired.",["running","to run","run","ran"],0,3,"keep + V-ing."],
["Don’t waste time ___ about unnecessary things.",["worrying","to worry","worry","worried"],0,3,"waste time + V-ing."],
["She might ___ the festival if she finishes early.",["visit","to visit","visiting","visited to"],0,4,"might + V без to."],
["The doctor advised the athlete ___ for a week.",["to rest","rest","resting","rested"],0,2,"advise + object + to + V."],
["My mum won’t let me ___ the wires.",["touch","to touch","touching","touched"],0,5,"let + object + V без to."],
["I miss ___ in the mountains and seeing beautiful landscapes.",["hiking","to hike","hike","hiked"],0,3,"miss + V-ing."],
["The crowd began to cheer when the athlete managed ___ the last sequence.",["to finish","finishing","finish","finished"],0,1,"manage + to + V."],
["Our parents never force us ___ a sport.",["to join","join","joining","joined"],0,2,"force + object + to + V."],
["The festival seems ___ more popular every year.",["to get","getting","get","to getting"],0,1,"seem + to + V."],
["The sign warned drivers ___ near the wires.",["not to park","don’t park","not parking","to not parked"],0,2,"warn + object + not to + V."],
["Could you ___ the sequence again, please?",["repeat","to repeat","repeating","repeated"],0,4,"could + V без to."],
["I fancy ___ to the festival this weekend.",["going","to go","go","went"],0,3,"fancy + V-ing."],
["The mayor urged people ___ unnecessary trips.",["to avoid","avoid","avoiding","avoided"],0,2,"urge + object + to + V."],
["We intend ___ several times before the festival.",["to rehearse","rehearsing","rehearse","rehearsed"],0,1,"intend + to + V."],
["He finished ___ the landscapes and put the brush down.",["painting","to paint","paint","painted"],0,3,"finish + V-ing."]];
const $=s=>document.querySelector(s);const pick=()=>sh(Q).slice(0,15);
let st={i:0,sc:0,list:[],wrong:[],done:false};
let best=0;try{best=+localStorage.getItem("gt_best")||0}catch(e){}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function rules(){$("#rules").innerHTML=P.map(p=>`<div class="card"><h3>${p[0]}. ${p[1]}</h3><span class="f">${p[2]}</span><div class="vs"><b>Verbs:</b> ${p[3]}</div><div class="ex">${p[4]}</div></div>`).join("")+
`<div class="card"><h3>💡 Лайфхаки</h3><div class="vs">• Після прийменника (<b>first step towards</b>) ставимо <b>-ing</b>.<br>• <b>make / let</b> + людина + V <b>без to</b>.<br>• <b>stop doing</b> = припинити; <b>stop to do</b> = зупинитися, щоб зробити.<br>• Заперечення: <b>not to</b> + V (warned us <b>not to</b> go).</div></div>
<div class="card"><h3>📚 Слова для практики</h3><div class="chips">${W.map(w=>`<span class="chip">${w[0]} <i>— ${w[1]}</i></span>`).join("")}</div></div>
<button class="btn" id="go">Почати вправи →</button>`;$("#go").onclick=()=>tab(1)}
function start(l){st={i:0,sc:0,list:l,wrong:[],done:false};show()}
function show(){const el=$("#quiz");
if(st.i>=st.list.length){const n=st.list.length,p=Math.round(st.sc/n*100);
if(st.list.length===15&&p>best){best=p;try{localStorage.setItem("gt_best",best)}catch(e){}}
el.innerHTML=`<div class="card c"><div class="big">${st.sc}/${n}</div><p>${p>=90?"🏆 Супер! Ти майстер verb patterns!":p>=60?"👍 Добре! Ще трохи практики.":"💪 Не здавайся — перечитай правила і спробуй ще."}</p><p class="vs">Найкращий результат: ${best}%</p>
${st.wrong.length?`<button class="btn" id="rw">Повторити помилки (${st.wrong.length})</button> `:""}<button class="btn g" id="ra">Почати заново</button> <button class="btn g" id="rr">До правил</button></div>`;
if(st.wrong.length)$("#rw").onclick=()=>start(sh(st.wrong));$("#ra").onclick=()=>start(pick());$("#rr").onclick=()=>tab(0);return}
const q=st.list[st.i],ops=sh(q[1]);
el.innerHTML=`<div class="meta"><span>Питання ${st.i+1} / ${st.list.length}</span><span>✅ ${st.sc}</span></div><div class="bar"><div style="width:${st.i/st.list.length*100}%"></div></div>
<div class="card"><div class="meta"><span>Pattern ${q[3]}</span></div><div class="q">${q[0].replace("___","<u id='gap'>&nbsp;</u>")}</div>${ops.map(o=>`<button class="o">${o}</button>`).join("")}<div class="fb" id="fb"></div><button class="btn" id="nx" hidden>Далі →</button></div>`;
el.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const ok=b.textContent===q[1][q[2]];
el.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent===q[1][q[2]])x.classList.add("ok")});
if(!ok){b.classList.add("no");st.wrong.push(q)}else st.sc++;
$("#gap").textContent=q[1][q[2]];const f=$("#fb");f.className="fb "+(ok?"ok":"no");
f.innerHTML=(ok?"✅ Правильно! ":"❌ Не зовсім. ")+q[4]+"<br><b>Pattern "+q[3]+":</b> "+P[q[3]-1][2];
$("#nx").hidden=false;$("#nx").textContent=st.i+1>=st.list.length?"Результат":"Далі →"});
$("#nx").onclick=()=>{st.i++;show()}}
function tab(n){$("#t0").classList.toggle("on",!n);$("#t1").classList.toggle("on",!!n);$("#rules").hidden=!!n;$("#quiz").hidden=!n;if(n&&!st.list.length)start(pick());else if(n)show();scrollTo(0,0)}
$("#t0").onclick=()=>tab(0);$("#t1").onclick=()=>tab(1);rules();
</script></body></html>
